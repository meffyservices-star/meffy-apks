name: Importar Bolsillito desde Vercel

on:
  push:
    paths:
      - .github/workflows/importar-bolsillito.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar los archivos publicados
        run: |
          set -euo pipefail
          BASE=https://bolsillito.vercel.app
          D=bolsillito/publicado
          mkdir -p "$D/.well-known"
          for f in index.html offline.js sw.js manifest.webmanifest icon-192.png icon-512.png .well-known/assetlinks.json p0.bin p1.bin p2.bin p3.bin p4.bin p5.bin; do
            curl -fsS -o "$D/$f" "$BASE/$f"
          done
          sha1sum "$D"/*.bin "$D"/*.js "$D"/index.html

      - name: Extraer el código legible de la app
        run: |
          set -euo pipefail
          D=bolsillito/publicado
          S=bolsillito/fuente
          mkdir -p "$S"
          cat "$D"/p0.bin "$D"/p1.bin "$D"/p2.bin "$D"/p3.bin "$D"/p4.bin "$D"/p5.bin | gunzip > /tmp/app.json
          node -e "
            const fs = require('fs');
            const o = JSON.parse(fs.readFileSync('/tmp/app.json', 'utf8'));
            fs.writeFileSync('$S/app.js', o.js);
            fs.writeFileSync('$S/estilos.css', o.css);
            fs.writeFileSync('$S/cuerpo.html', o.body);
            console.log('js', o.js.length, 'css', o.css.length, 'body', o.body.length);
          "

      - name: Guardar en el repositorio
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add bolsillito
          git commit -m "Bolsillito: copia de la versión publicada en Vercel" || echo "Sin cambios"
          git push
