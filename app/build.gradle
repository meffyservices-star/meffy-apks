apply plugin: 'com.android.application'

android {
    namespace 'app.aeffy.music'
    compileSdk 35
    defaultConfig {
        applicationId 'app.aeffy.music'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.2.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
